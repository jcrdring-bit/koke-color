[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Proxy seguro para la API del chatbot DeepSeek
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Endpoint seguro para autenticación de Administrador
[[redirects]]
  from = "/api/admin-auth"
  to = "/.netlify/functions/admin-auth"
  status = 200

# Endpoint seguro para procesar pagos con tarjeta (Mercado Pago)
[[redirects]]
  from = "/api/process-payment"
  to = "/.netlify/functions/process-payment"
  status = 200

# Endpoint Webhook oficial para Meta / WhatsApp Cloud API
[[redirects]]
  from = "/api/webhook"
  to = "/.netlify/functions/webhook"
  status = 200

# Redirección SPA estándar
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de Seguridad HTTP para producción
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
